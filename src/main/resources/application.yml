spring:
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    pool:
      enabled: true
      max-connections: 10

app:
  queues:
    transaction: account.transaction.queue
    accumulative: account.accumulative.queue

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        'http.server.requests': true
    tags:
      application: balance-system